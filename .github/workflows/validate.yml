name: Validate

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Install repository dependencies
        run: |
          flutter pub get
          npm --prefix functions ci
      - name: Enforce architecture and retry boundaries
        run: |
          python3 tool/check_package_boundaries_test.py
          python3 tool/check_package_boundaries.py --max 0
          python3 tool/check_command_retry_contract.py
      - name: Run the repository full validation contract
        run: dart run :mosigame validate --full
