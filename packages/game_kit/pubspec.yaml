name: game_kit
description: 게임 화면과 흐름이 재사용하는 공용 도구입니다.
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cloud_functions: ^6.4.0
  audioplayers: ^6.8.1
  cloud_firestore: ^6.9.0
  crypto: ^3.0.7
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  shared_preferences: ^2.5.5
  shorebird_code_push: ^2.0.7
  wakelock_plus: ^1.7.0
  firebase_database: ^12.5.0
  flutter_markdown: ^0.7.7
  provider: ^6.1.5+1
  roulette: ^0.3.2
  video_player: ^2.10.0
dev_dependencies:
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
flutter:
  assets:
    - assets/images/phone_result/
    - assets/sounds/
    - assets/images/reconnect/
    - assets/images/patch/
    - assets/images/others/
    - assets/images/character/
    - assets/images/widgets/roulette/
flutter_gen:
  output: lib/gen/
  assets:
    outputs:
      package_parameter_enabled: true
