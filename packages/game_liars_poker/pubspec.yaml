name: game_liars_poker
description: 번들 Liar's Poker 게임 패키지입니다.
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  game_kit: any
  firebase_auth: ^6.6.1
  firebase_database: ^12.5.0
  flutter_riverpod: ^3.4.2
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  vector_graphics: ^1.2.3
dev_dependencies:
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
flutter:
  assets:
    - assets/games/liars_poker/animations/
    - assets/games/liars_poker/images/background/
    - assets/games/liars_poker/images/button/
    - assets/games/liars_poker/images/cards/
    - assets/games/liars_poker/images/icons/
    - assets/games/liars_poker/images/layout/
    - assets/games/liars_poker/images/modal/
    - assets/games/liars_poker/images/other/
    - assets/games/liars_poker/images/table/
    - assets/games/liars_poker/sounds/
flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
  assets:
    outputs:
      package_parameter_enabled: true
