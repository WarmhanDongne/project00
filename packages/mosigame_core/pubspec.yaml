name: mosigame_core
description: Mosigame의 플랫폼 독립 공통 기반입니다.
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.4.0
  crypto: ^3.0.7
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  firebase_database: ^12.5.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  shorebird_code_push: ^2.0.7
  wakelock_plus: ^1.7.0
dev_dependencies:
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
flutter:
  assets:
    - assets/images/character/
    - assets/images/others/
    - assets/images/patch/
    - assets/images/reconnect/
    - assets/sounds/
flutter_gen:
  output: lib/gen/
  assets:
    outputs:
      package_parameter_enabled: true
