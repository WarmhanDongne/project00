  .screen.print { --paper:#e9e4d8; --ink:#252522; --muted:#68665d; --accent:#31564e; --accent2:#9b3d35; --line:#aaa79a; --panel:#f6f3e9; --board:#d4c9ac; --node:#373a32; --edge:#40453d; --radius:2px; }
  .screen.print::before { opacity:.28; background-image:radial-gradient(#343a31 .55px,transparent .7px); background-size:4px 4px; mask:none; }
  .screen.print .top { border-bottom:2px solid var(--ink); }
  .screen.print .team,.screen.print .result,.screen.print .history,.screen.print .board-shell { box-shadow:none; }
  .screen.hip { --paper:#faf1df; --ink:#202526; --muted:#69716c; --accent:#f05c49; --accent2:#355f56; --line:#d6c6a4; --panel:#fffaf0; --board:#e8d6b0; --node:#415248; --edge:#41372e; --radius:14px; }
  .screen.hip::before { inset:0; opacity:.8; background:linear-gradient(90deg,transparent 0 69%,#d7e2d5 69% 70%,transparent 70%),linear-gradient(0deg,transparent 0 68%,#e7c2a4 68% 69%,transparent 69%),linear-gradient(135deg,transparent 49.5%,rgba(53,95,86,.15) 50%,transparent 51%); background-size:auto,auto,38px 38px; mask:none; }
  .screen.hip .seal { border:2px solid var(--accent); border-radius:50%; font-size:13px; transform:rotate(8deg); }
  .screen.hip .roll { border-radius:5px; letter-spacing:.05em; }
  @media (max-width: 980px) { .page{padding:26px 16px 46px}.intro{align-items:start;flex-direction:column}.legend{max-width:100%}.grid{grid-template-columns:1fr} }
  @media print { body{background:#fff}.page{max-width:none;padding:12px}.grid{gap:10px}.concept{break-inside:avoid;box-shadow:none}.caption{padding:9px 12px}.screen{print-color-adjust:exact;-webkit-print-color-adjust:exact} }
</style>
</head>
<body>
<main class="page">
  <header class="intro">
    <div>
      <p class="eyebrow">MOSIGAME · TABLET CONCEPT STUDY</p>
      <h1>전략 윷놀이<br>태블릿 화면 디자인 20안</h1>
      <p>같은 플레이 상태와 정보 배치를 두고, 시각 언어를 비교하는 콘셉트 시트입니다. 추가 10안은 첨부 이미지의 색이나 그림체를 가져오지 않고, 단청·조각보·옹기·나전·기와·탈춤·매듭 등 한국 전통의 소재와 조형 원리를 새로 해석했습니다.</p>
    </div>
    <div class="legend">가로 태블릿 진행 화면 · 상태 표시는 시각화용 예시<br>규칙·점수·게임 흐름은 아직 확정하지 않았습니다.</div>
  </header>
  <h2 class="series-title"><span>01 — 10</span>기존 콘셉트</h2>
  <section class="grid" id="concepts" aria-label="기존 디자인 콘셉트 10안"></section>
  <h2 class="series-title"><span>11 — 20</span>전통 요소를 새로 해석한 추가 콘셉트</h2>
  <section class="grid" id="more-concepts" aria-label="추가 디자인 콘셉트 10안"></section>
</main>
<script>
const concepts = [
  ['한지와 먹','담백한 여백 · 붓글씨 · 인장','ink','韓'],
  ['오방색 놀이마당','명확한 팀 색 · 잔치의 활기','festival','놀이'],
  ['원목 보드게임','따뜻한 나뭇결 · 손에 잡히는 말','wood','木'],
  ['민화 산수화','청록 산수 · 파도와 산 능선','minhwa','山'],
  ['청화와 금박','궁중 문양 · 학과 매화의 격식','crane','鶴'],
  ['한글 서책','훈민정음 · 붉은 인주 · 서책','calligraphy','ᄒᆞᆫ'],
  ['서울의 밤','서울 야경 · 네온 포인트 · 현대적 리듬','seoul','SEOUL'],
  ['해와 달의 길','청색 산수 · 해와 달 · 상징적 보드','cosmos','☼'],
  ['종이접기','접힌 면 · 민트 종이 · 산뜻한 입체감','paperfold','折'],
  ['차분한 모던','절제된 장식 · 높은 대비 · 보드 우선','modern','윷']
];
const moreConcepts = [
  ['단청의 선','기둥과 공포의 색띠 · 반복되는 건축 문양','dancheong','丹'],
  ['조각보의 판','천 조각의 분할 · 솔기와 비대칭 그리드','jogakbo','襆'],
  ['옹기의 곡선','옹기 표면 · 둥근 형태 · 소박한 흙빛','onggi','甕'],
  ['나전의 빛','칠기 바탕 · 자개 조각 · 절제된 무지갯빛','najeon','螺'],
  ['기와의 리듬','기와 골과 처마선 · 단정한 건축 실루엣','giwa','瓦'],
  ['탈춤의 한판','탈의 과장된 표정 · 장단감 있는 그래픽','talchum','탈'],
  ['장터 목판','옛 장터 간판 · 목판 인쇄 · 활기찬 정보 위계','market','場'],
  ['전통 매듭','매듭의 고리와 술 · 흐름을 잇는 선형 장식','maedeup','結'],
  ['민화 목판 인쇄','판화의 굵은 윤곽 · 제한된 잉크 · 찍어낸 질감','print','印'],
  ['힙한 한글 민속','전통 문양의 단순화 · 현대 한글 타이포그래피','hip','한']
];
const circlePoints = [[50,5],[72,5],[95,5],[95,28],[95,50],[95,72],[95,95],[72,95],[50,95],[28,95],[5,95],[5,72],[5,50],[5,28],[5,5],[27,27],[50,50],[73,73],[73,27],[50,50],[27,73]];
function svgBoard(){
  const points = circlePoints.map(([x,y],i)=>`<circle class="${[0,4,8,12,14,16,18,20].includes(i)?'corner ':''}${i===16?'center':''}" cx="${x}" cy="${y}" r="${i===16?3.6:2.2}"/>`).join('');
  return `<svg class="track" viewBox="0 0 100 100" aria-hidden="true"><path d="M5 5H95V95H5Z"/><path class="diag" d="M5 5L50 50L95 95M95 5L50 50L5 95"/>${points}</svg>`;
}
function makeConcept([name,subtitle,theme,seal],i){
  const n=String(i+1).padStart(2,'0');
  return `<article class="concept"><header class="caption"><div><h2>${n}. ${name}</h2><p>${subtitle}</p></div><span class="number">${n}</span></header><section class="screen ${theme}" aria-label="${name} 태블릿 게임 진행 화면">
    <div class="top"><div class="brand"><span class="seal">${seal}</span><div><strong>전략 윷놀이</strong><small>모시겜 · TABLE ${n}</small></div></div><div class="meta"><span class="pill">4라운드</span><span class="pill">팀 대결</span><span class="exit">×</span></div></div>
    <div class="layout"><aside class="team-col"><div class="team active"><div class="team-head"><span class="avatar">청</span><div><b>청팀</b><small>민준 · 서연</small></div></div><div class="progress"><i></i></div><div class="scores"><span>완주 말</span><b>2 / 4</b></div></div><div class="turn-card"><small>NOW PLAYING</small><strong>청팀 차례</strong></div><div class="team red"><div class="team-head"><span class="avatar">홍</span><div><b>홍팀</b><small>지우 · 도윤</small></div></div><div class="progress"><i></i></div><div class="scores"><span>완주 말</span><b>1 / 4</b></div></div></aside>
    <div class="board-shell"><div class="board">${svgBoard()}<span class="stone s1">청</span><span class="stone blue s2">홍</span><span class="stone s3">청</span><span class="stone blue s4">홍</span><span class="center-mark">윷</span></div><span class="board-label">YUT BOARD · 진행 경로</span></div>
    <aside class="action-col"><div class="result"><small>최근 결과</small><strong>도</strong><span>말 이동을 선택하세요</span></div><div class="sticks"><i class="stick"></i><i class="stick"></i><i class="stick back"></i><i class="stick"></i></div><div class="history"><b>최근 기록</b><p><span>청팀</span><span>도 · 이동</span></p><p><span>홍팀</span><span>걸 · 이동</span></p></div><button class="roll" type="button">윷 던지기</button><div class="hint">차례와 이동 상태를<br>큰 글자로 안내합니다</div></aside></div>
  </section></article>`;
}
document.getElementById('concepts').innerHTML=concepts.map(makeConcept).join('');
document.getElementById('more-concepts').innerHTML=moreConcepts.map((concept,i)=>makeConcept(concept,i+10)).join('');
</script>
</body>
</html>
