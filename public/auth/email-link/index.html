<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>모시겜 이메일 인증</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fafafa;
        color: #222;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(420px, calc(100% - 40px));
        text-align: center;
      }
      h1 { font-size: 24px; }
      p { color: #666; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>모시겜 이메일 인증</h1>
      <p>
        이메일 인증은 모시겜 앱에서 완료됩니다.<br />
        앱이 설치된 휴대폰에서 인증 메일의 링크를 다시 열어 주세요.
      </p>
    </main>
  </body>
</html>
